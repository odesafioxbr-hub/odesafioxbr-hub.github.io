<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estudo — meditação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#c6ff4a;--bg:#050505}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#eee;font:16px/1.45 Inter,system-ui,sans-serif}
.selo{margin:0;padding:.7rem 1rem;background:#120e06;color:#ffa400;font-weight:700;text-align:center}
main{max-width:820px;margin:0 auto;padding:1rem}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.04em;font-size:2.4rem;margin:.2rem 0}
.sub{color:#c8c8c8;max-width:46rem}
.controles{display:flex;flex-wrap:wrap;gap:.6rem;align-items:end;margin:1rem 0}
label{display:flex;flex-direction:column;gap:.25rem;color:#ccc;font-size:.9rem}
input[type="number"]{min-height:44px;width:5.5rem;background:#000;color:#fff;border:1px solid #444;border-radius:8px;padding:0 .4rem}
button{min-height:44px;border-radius:999px;border:1px solid #3a3a3a;background:#000;color:#fff;padding:0 .9rem;cursor:pointer;font:700 1rem/1 Inter,sans-serif}
.estado{color:var(--g);font-weight:700}
.palco{position:relative;background:#000;border-radius:16px;overflow:hidden}
.palco img,.palco canvas{width:100%;height:auto;display:block}
.palco canvas{position:absolute;inset:0;width:100%;height:100%}
</style>
</head>
<body>
<p class="selo">Estudo isolado. A água aprovada não entra aqui. Não publica.</p>
<main>
  <h1>MEDITAR</h1>
  <p class="sub">Sete pontos na coluna, da base da pélvis até a coroa, e um fio que cresce com os dias. No zero está apagado. Os oito pontos laterais só aparecem ao concluir 15 de 15. Não é leitura clínica. O exemplo desta cena é 8 de 15.</p>
  <div class="controles">
    <label>Duração<input id="duracao" type="number" min="7" value="15"></label>
    <label>Dias cumpridos<input id="dias" type="number" min="0" value="8"></label>
    <button type="button" id="zero">Zero</button>
    <button type="button" id="parcial">Parcial</button>
    <button type="button" id="cheio">15 de 15</button>
    <button type="button" id="play">Acender</button>
  </div>
  <p class="estado" id="estado"></p>
  <div class="palco">
    <img id="figura" src="figura.png" alt="Figura sentada, sem os pontos acesos" width="420" height="600">
    <canvas id="luz" width="420" height="600"></canvas>
  </div>
</main>
<script>
(function () {
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var pontos = [
    { nome: "coroa", x: 164, y: 74, cor: "#c86bff" },
    { nome: "entre as sobrancelhas", x: 164, y: 116, cor: "#7a4ad8" },
    { nome: "garganta", x: 164, y: 220, cor: "#3aa0e8" },
    { nome: "centro do peito", x: 164, y: 318, cor: "#3dce4a" },
    { nome: "alto abdome", x: 164, y: 400, cor: "#f2d024" },
    { nome: "baixo abdome", x: 164, y: 448, cor: "#f08a24" },
    { nome: "base da pélvis", x: 164, y: 500, cor: "#e23b32" }
  ];
  var coroa = pontos[0], pelvis = pontos[6];
  var duracaoEl = document.getElementById("duracao");
  var diasEl = document.getElementById("dias");
  var estadoEl = document.getElementById("estado");
  var canvas = document.getElementById("luz");
  var ctx = canvas.getContext("2d");
  var raf = 0;
  function ler() {
    var dur = Math.max(7, Math.round(Number(duracaoEl.value) || 7));
    duracaoEl.value = String(dur);
    diasEl.max = String(dur);
    var dias = Math.max(0, Math.min(dur, Math.round(Number(diasEl.value) || 0)));
    diasEl.value = String(dias);
    return { dur: dur, dias: dias, nivel: dur ? dias / dur : 0 };
  }
  function fDe(p) {
    return (pelvis.y - p.y) / (pelvis.y - coroa.y);
  }
  function desenhar(light, extras) {
    ctx.clearRect(0, 0, 420, 600);
    pontos.forEach(function (p) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 32, 0, Math.PI * 2);
      ctx.fillStyle = "#2a2a29";
      ctx.fill();
    });
    if (light > 0.012) {
      var tipY = pelvis.y + (coroa.y - pelvis.y) * light;
      ctx.strokeStyle = "rgba(230,255,190,.9)";
      ctx.lineWidth = 4;
      ctx.shadowColor = "rgba(220,255,180,.8)";
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(pelvis.x, pelvis.y);
      ctx.lineTo(pelvis.x, tipY);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    pontos.forEach(function (p) {
      var f = fDe(p);
      var on = Math.max(0, Math.min(1, (light - (f - 0.06)) / 0.1));
      ctx.beginPath();
      ctx.arc(p.x, p.y, 8 + 4 * on, 0, Math.PI * 2);
      ctx.fillStyle = on > 0.04 ? p.cor : "rgba(0,0,0,0)";
      ctx.globalAlpha = on;
      ctx.shadowColor = p.cor;
      ctx.shadowBlur = 16 * on;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    });
    if (extras) {
      for (var i = 0; i < 8; i++) {
        var lado = i < 4 ? -1 : 1;
        var k = i % 4;
        var y = 230 + k * 58;
        var x = 164 + lado * 42;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fillStyle = "#ffb020";
        ctx.shadowColor = "#ffb020";
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
    canvas.dataset.luz = String(Math.round(light * 1000) / 1000);
    canvas.dataset.extras = extras ? "8" : "0";
  }
  function texto(light, extras, extra) {
    var s = ler();
    var acesos = Math.min(7, light * 7);
    estadoEl.textContent = acesos.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " de 7 · " + s.dias + " de " + s.dur + " dias." +
      (extras ? " Oito pontos laterais visíveis." : s.dur === 15 ? " Os oito laterais esperam o 15 de 15." : "") +
      (extra ? " " + extra : "");
  }
  function parar() { if (raf) cancelAnimationFrame(raf); raf = 0; }
  function mostrar(light, extras, extra) {
    desenhar(light, extras);
    texto(light, extras, extra);
  }
  function acender() {
    var s = ler();
    var alvo = s.nivel;
    var extrasFinais = s.dur === 15 && s.dias >= s.dur;
    parar();
    if (reduced) {
      mostrar(alvo, extrasFinais, "Movimento reduzido: estado dos dias, direto.");
      return;
    }
    var t0 = performance.now();
    var frame = function (now) {
      var u = Math.max(0, Math.min(1, (now - t0) / 2400));
      var e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      mostrar(alvo * e, extrasFinais && u >= 0.98);
      if (u < 1) raf = requestAnimationFrame(frame);
      else raf = 0;
    };
    mostrar(0, false);
    raf = requestAnimationFrame(frame);
  }
  document.getElementById("zero").addEventListener("click", function () { parar(); diasEl.value = "0"; var s = ler(); mostrar(s.nivel, false); });
  document.getElementById("parcial").addEventListener("click", function () {
    parar();
    diasEl.value = String(Math.round(ler().dur * 0.45));
    var s = ler();
    mostrar(s.nivel, false);
  });
  document.getElementById("cheio").addEventListener("click", function () {
    parar();
    duracaoEl.value = "15";
    diasEl.value = "15";
    mostrar(1, true);
  });
  document.getElementById("play").addEventListener("click", acender);
  function repousar() {
    parar();
    var s = ler();
    mostrar(s.nivel, s.dur === 15 && s.dias >= s.dur);
  }
  duracaoEl.addEventListener("change", repousar);
  diasEl.addEventListener("change", repousar);
  repousar();
})();
</script>
</body>
</html>
